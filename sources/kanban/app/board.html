<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>协作看板</title>
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <div id="shell">
    <main id="main" aria-labelledby="heading">
      <header id="bar">
        <div class="titles">
          <h1 id="heading"></h1>
          <small id="summary" class="muted"></small>
        </div>
        <button id="add" type="button" class="icon"><gugu-icon name="plus"></gugu-icon></button>
      </header>
      <form id="new" hidden>
        <input id="new-title" maxlength="200" autocomplete="off">
        <button type="submit" class="primary" id="new-ok"></button>
        <button type="button" id="new-cancel"></button>
      </form>
      <p id="alert" role="alert" hidden></p>
      <div id="list"></div>
    </main>
    <div id="scrim" hidden></div>
    <aside id="sheet" hidden aria-labelledby="s-title"></aside>
  </div>
  <div id="undo" role="status" hidden></div>
  <dialog id="confirm"><form method="dialog"><p id="confirm-text"></p><div class="row end"><button value="no" id="confirm-no"></button><button value="yes" class="danger" id="confirm-yes"></button></div></form></dialog>
  <script type="module" src="board.js"></script>
</body>
</html>
