<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>协作看板</title>
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <div id="shell">
    <section id="main" aria-labelledby="heading">
      <header id="bar">
        <h1 id="heading"></h1>
        <div id="views" role="tablist"></div>
        <select id="where" hidden></select>
        <small id="summary" class="muted"></small>
        <div id="filters" role="tablist"></div>
      </header>
      <nav id="people" aria-label="负责人" hidden></nav>
      <div id="asks" role="region" aria-label="等你拍板" hidden></div>
      <p id="alert" role="alert" hidden></p>
      <div id="board"></div>
      <div id="team" hidden></div>
      <div id="ledger" hidden></div>
    </section>
    <aside id="drawer" hidden aria-labelledby="d-title"></aside>
  </div>
  <script type="module" src="page.js"></script>
</body>
</html>
