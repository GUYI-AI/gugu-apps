<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>西游</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="status" role="status"></div>
<div id="world">
  <main>
    <header class="top">
      <div><h3 id="room"></h3><small id="clock"></small></div>
      <button id="crowd" type="button" class="crowd" aria-controls="people" aria-expanded="false"></button>
    </header>
    <div id="log" role="log" aria-label="故事" aria-live="polite"></div>
    <div id="here" class="chips" aria-label="这里"></div>
    <div id="stats" class="hud" aria-label="气血 精神 食物 水"></div>
    <div class="dock">
      <div id="pad" class="compass small" aria-label="出口"></div>
      <div class="dock-right">
        <div id="quick" class="quick" aria-label="常用指令"></div>
        <form id="say" class="say">
          <input id="line" autocomplete="off" enterkeyhint="send" aria-label="指令" placeholder="说话，或输入指令" />
          <button class="primary" type="submit">发送</button>
        </form>
      </div>
    </div>
  </main>
  <aside id="side">
    <h5>方向</h5>
    <div id="compass" class="compass" aria-label="出口"></div>
    <h5>这里</h5>
    <ul id="here-list" class="rows"></ul>
    <section id="people-box">
      <h5>同行的人</h5>
      <ul id="people" class="rows"></ul>
    </section>
  </aside>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
