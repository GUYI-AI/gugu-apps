<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文字江湖</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="status" role="status"></div>
<main id="world" class="stack">
  <header class="where">
    <h3 id="room"></h3>
    <div id="exits" class="row" aria-label="出口"></div>
  </header>
  <div id="log" role="log" aria-label="江湖" aria-live="polite"></div>
  <div id="here" class="row" aria-label="这里"></div>
  <form id="say" class="row">
    <input id="line" autocomplete="off" enterkeyhint="send" aria-label="指令" placeholder="说点什么，或输入指令：看、东、问 店小二 李先生…" />
    <button class="primary" type="submit">发送</button>
  </form>
  <div id="quick" class="row" aria-label="常用指令"></div>
  <section aria-labelledby="people-h">
    <h5 id="people-h">江湖中人</h5>
    <ul id="people" class="list"></ul>
  </section>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
