<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>咕咕办公</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-state="message">
  <div id="banner" class="banner" role="status" hidden></div>
  <p id="doc-message" class="empty doc-message"></p>
  <article id="preview" class="preview"></article>
  <!-- What is picked, gathered: floats by the last pick while there is one (app.js placeBar), then goes to the composer. -->
  <div id="pick-bar" class="pick-bar" role="toolbar" aria-hidden="true">
    <span id="pick-count" class="pick-count"></span>
    <button id="pick-send" class="pick-send" type="button"><span id="pick-send-label"></span><kbd>⏎</kbd></button>
    <button id="pick-dispatch" class="pick-send" type="button"></button>
    <button id="pick-clear" class="pick-clear" type="button">✕</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
