<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>咕咕办公</title>
<link rel="stylesheet" href="home.css" />
</head>
<body>
  <!-- One bar on a page drawn for a chat: that chat's files (the host's own folder), and 「新建」 where a blank file can be made. -->
  <header class="bar" id="bar" hidden>
    <button id="folder" type="button" class="plain"><gugu-icon name="folder"></gugu-icon><span id="folder-label"></span></button>
    <div class="new">
      <button id="new" type="button" class="primary" aria-haspopup="menu" aria-expanded="false" hidden><gugu-icon name="plus"></gugu-icon><span id="new-label"></span></button>
      <div id="create" class="menu" role="menu" hidden></div>
    </div>
  </header>
  <main id="main">
    <p id="note" role="status" class="muted" hidden></p>
    <p id="error" role="alert" hidden></p>
    <!-- Blank files to start from, as cards (Office's 「新建」 row): on a wide page, and when nothing was opened yet. -->
    <section id="blanks" hidden></section>
    <h5 id="files-title"></h5>
    <ul id="files" class="list"></ul>
    <div id="empty" hidden></div>
  </main>
  <script type="module" src="home.js"></script>
</body>
</html>
