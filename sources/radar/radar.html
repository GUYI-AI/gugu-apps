<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>雷达</title><link rel="stylesheet" href="radar.css"></head>
<body>
  <header id="bar">
    <div role="tablist" id="modes">
      <button role="tab" id="mode-local" aria-selected="true">这个任务</button>
      <button role="tab" id="mode-all" aria-selected="false">全部</button>
    </div>
    <label id="depth-box"><span id="depth-label">看几层</span> <select id="depth"><option>1</option><option>2</option><option>3</option></select></label>
    <ul id="counts" aria-label="状态"></ul>
    <span id="pulse"><i class="beat"></i><small id="checked"></small><button id="refresh" aria-label="立即查看"><gugu-icon name="refresh"></gugu-icon></button></span>
  </header>
  <p id="alert" role="alert" hidden></p>
  <main id="stage">
    <svg id="graph" aria-label="雷达"></svg>
    <p id="empty" role="status" hidden></p>
    <div id="empty-all" hidden>
      <svg viewBox="0 0 120 120" class="sweep" aria-hidden="true"><circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="38"/><circle cx="60" cy="60" r="20"/><circle cx="60" cy="60" r="4" class="me"/></svg>
      <strong id="empty-all-title"></strong><small id="empty-all-how"></small>
      <code id="empty-example">watch({ target: "session:…", level: "needs_you" })</code>
    </div>
    <div id="tip" hidden></div>
    <small id="hint"><span class="line"></span><span id="l-path"></span></small>
  </main>
  <aside id="side">
    <section id="detail" hidden></section>
    <section id="inbox">
      <div class="sec-head"><h5 id="recent">提醒</h5><div role="tablist" id="filters" class="chips"></div></div>
      <div id="log"></div>
    </section>
    <section id="watches">
      <div class="sec-head"><h5 id="watch-title">正在关注</h5><small class="muted" id="watch-n"></small></div>
      <div id="watch-list"></div>
    </section>
  </aside>
  <script src="graph.js"></script>
  <script type="module" src="radar.js"></script>
</body>
</html>
