<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日历</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="head">
    <button id="prev" class="nav" type="button" aria-label="上个月"><gugu-icon name="chevron-left"></gugu-icon></button>
    <button id="month" class="month" type="button"></button>
    <button id="next" class="nav" type="button" aria-label="下个月"><gugu-icon name="chevron-right"></gugu-icon></button>
  </header>
  <div class="weekdays" id="weekdays"></div>
  <div class="grid" id="grid"></div>
  <p id="err" role="alert" hidden></p>
  <section class="day">
    <div class="day-title"><strong id="day-title"></strong><small class="muted" id="day-sub"></small></div>
    <div id="todo-sec" hidden>
      <h5 id="todo-label">待办</h5>
      <div id="todos"></div>
    </div>
    <div id="memory-sec" hidden>
      <h5 id="memory-label">记事</h5>
      <div id="memories"></div>
    </div>
    <p class="empty" id="empty" hidden></p>
    <form id="add" class="add">
      <input id="add-input" autocomplete="off" placeholder="加一条待办，回车">
    </form>
  </section>
</main>
<script src="main.js"></script>
</body>
</html>
